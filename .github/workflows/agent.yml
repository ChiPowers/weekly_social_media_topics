name: Content Intelligence Agent

on:
  schedule:
    - cron: '0 9 * * 1'   # Every Monday at 09:00 UTC
  workflow_dispatch:         # Allow manual trigger for testing

jobs:
  run-agent:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Debug environment and dependencies
        run: |
          echo "TAVILY set: ${TAVILY_API_KEY:+yes}"
          echo "ANTHROPIC set: ${ANTHROPIC_API_KEY:+yes}"
          echo "API_CALL_BUDGET: ${API_CALL_BUDGET:-unset}"
          pip show tavily-python || pip show tavily || true
          python -c "import importlib; t=importlib.import_module('tavily'); print('TAVILY_IMPORT_OK', getattr(t,'__version__','unknown'))" || python -c "print('TAVILY_IMPORT_FAILED')"

      - name: Run agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          API_CALL_BUDGET: ${{ vars.API_CALL_BUDGET }}
        run: python run.py
